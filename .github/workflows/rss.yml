name: Generate Coffee News RSS

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00 生成一次
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 允许在 GitHub 网页手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个，避免并发覆盖
concurrency:
  group: coffee-rss-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成聚合 feed
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python coffee_news_aggregator.py --config feeds.toml --out public --limit 50 --base "$BASE"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
